<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b7fb6"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8302e"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- title -->
  <text x="48" y="62" font-size="34" font-weight="700" fill="#14213d">The agentic platform in one picture</text>
  <text x="48" y="94" font-size="18" fill="#4a5060">One front door, one identity per agent, one gateway, one register. How agents are admitted, contained and watched.</text>

  <!-- governance band (top right) -->
  <rect x="1010" y="36" width="542" height="70" rx="10" fill="#eef0f4" stroke="#c9ced8"/>
  <text x="1030" y="62" font-size="15" font-weight="700" fill="#14213d">Governance: the tier gate</text>
  <text x="1030" y="84" font-size="14" fill="#333">A tier of agents opens only when the people it needs exist.</text>
  <text x="1030" y="100" font-size="14" fill="#333">Humans raise an agent's autonomy; machines can only lower it.</text>

  <!-- users -->
  <g>
    <circle cx="90" cy="300" r="20" fill="none" stroke="#3b7fb6" stroke-width="2"/>
    <circle cx="90" cy="292" r="7" fill="#3b7fb6"/>
    <path d="M76,312 q14,-14 28,0" fill="#3b7fb6"/>
    <text x="90" y="345" font-size="15" font-weight="700" fill="#14213d" text-anchor="middle">People</text>
    <rect x="150" y="180" width="110" height="60" rx="8" fill="#f6f8fb" stroke="#3b7fb6"/><text x="205" y="215" font-size="14" text-anchor="middle" fill="#14213d">Intranet</text>
    <rect x="150" y="270" width="110" height="60" rx="8" fill="#f6f8fb" stroke="#3b7fb6"/><text x="205" y="299" font-size="14" text-anchor="middle" fill="#14213d">Google</text><text x="205" y="316" font-size="14" text-anchor="middle" fill="#14213d">Workspace</text>
    <rect x="150" y="360" width="110" height="60" rx="8" fill="#f6f8fb" stroke="#3b7fb6"/><text x="205" y="389" font-size="14" text-anchor="middle" fill="#14213d">Business</text><text x="205" y="406" font-size="14" text-anchor="middle" fill="#14213d">apps</text>
    <path d="M112,300 L150,210" stroke="#3b7fb6" stroke-width="1.5" fill="none"/>
    <path d="M112,300 L150,300" stroke="#3b7fb6" stroke-width="1.5" fill="none"/>
    <path d="M112,300 L150,390" stroke="#3b7fb6" stroke-width="1.5" fill="none"/>
    <path d="M260,210 L300,285" stroke="#3b7fb6" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M260,300 L300,300" stroke="#3b7fb6" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M260,390 L300,315" stroke="#3b7fb6" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- Gemini Enterprise: the front door -->
  <rect x="300" y="160" width="280" height="290" rx="12" fill="#ffffff" stroke="#14213d" stroke-width="2.5"/>
  <rect x="300" y="160" width="280" height="54" rx="12" fill="#14213d"/>
  <rect x="300" y="200" width="280" height="14" fill="#14213d"/>
  <text x="440" y="185" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Gemini Enterprise</text>
  <text x="440" y="205" font-size="13" fill="#d8dbe4" text-anchor="middle">the one front door</text>
  <g font-size="14" fill="#222">
    <text x="318" y="240">• People sign in once; an agent sees</text><text x="330" y="258">only what that person may see</text>
    <text x="318" y="284">• No-code assistants (Tier C) are built</text><text x="330" y="302">and used here, with their data stores</text>
    <text x="318" y="328">• An agent is reachable only once it is</text><text x="330" y="346">admitted from the register</text>
    <text x="318" y="372">• Every conversation is logged; the app</text><text x="330" y="390">and its data stay in the EU</text>
    <text x="318" y="416">• Model Armor screens the console too</text>
  </g>

  <!-- three controls every request crosses -->
  <text x="737" y="150" font-size="14" font-weight="700" fill="#14213d" text-anchor="middle">Three controls every request crosses</text>
  <g>
    <rect x="600" y="160" width="275" height="84" rx="10" fill="#e8f1f8" stroke="#3b7fb6" stroke-width="2"/>
    <text x="737" y="185" font-size="16" font-weight="700" fill="#14213d" text-anchor="middle">Agent Identity (IAM)</text>
    <text x="737" y="206" font-size="12.5" fill="#333" text-anchor="middle">one identity per agent, no shared credential,</text>
    <text x="737" y="223" font-size="12.5" fill="#333" text-anchor="middle">no domain-wide delegation, ever</text>

    <rect x="600" y="263" width="275" height="84" rx="10" fill="#e8f1f8" stroke="#3b7fb6" stroke-width="2"/>
    <text x="737" y="288" font-size="16" font-weight="700" fill="#14213d" text-anchor="middle">Model Armor</text>
    <text x="737" y="309" font-size="12.5" fill="#333" text-anchor="middle">screens every prompt and every response;</text>
    <text x="737" y="326" font-size="12.5" fill="#333" text-anchor="middle">produces evidence, is never the boundary</text>

    <rect x="600" y="366" width="275" height="84" rx="10" fill="#e8f1f8" stroke="#3b7fb6" stroke-width="2"/>
    <text x="737" y="391" font-size="16" font-weight="700" fill="#14213d" text-anchor="middle">Agent Gateway</text>
    <text x="737" y="412" font-size="12.5" fill="#333" text-anchor="middle">the one path for tool calls and agent-to-agent</text>
    <text x="737" y="429" font-size="12.5" fill="#333" text-anchor="middle">traffic (MCP, A2A); policy and telemetry here</text>
  </g>
  <path d="M580,305 L600,305" stroke="#3b7fb6" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M875,305 L905,305" stroke="#3b7fb6" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- agents and the register -->
  <rect x="905" y="160" width="245" height="150" rx="12" fill="#ffffff" stroke="#3b7fb6" stroke-width="2"/>
  <text x="1025" y="188" font-size="17" font-weight="700" fill="#14213d" text-anchor="middle">Agents</text>
  <text x="1027" y="212" font-size="12.5" fill="#333" text-anchor="middle">one Google Cloud project per agent,</text>
  <text x="1027" y="229" font-size="12.5" fill="#333" text-anchor="middle">made by a factory with its controls in place</text>
  <text x="1027" y="256" font-size="12.5" fill="#333" text-anchor="middle">Tiers: C read-only assistants · R read tools</text>
  <text x="1027" y="273" font-size="12.5" fill="#333" text-anchor="middle">W writes · P privileged (Wall-E) · X closed</text>
  <text x="1025" y="296" font-size="12" fill="#666" text-anchor="middle">runtime: Vertex AI Agent Engine</text>

  <rect x="905" y="330" width="245" height="120" rx="12" fill="#f6f8fb" stroke="#3b7fb6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1025" y="356" font-size="16" font-weight="700" fill="#14213d" text-anchor="middle">Register &amp; Agent Registry</text>
  <text x="1025" y="378" font-size="13" fill="#333" text-anchor="middle">agents · tools (MCP servers) · skills</text>
  <text x="1025" y="400" font-size="13" font-weight="700" fill="#b8302e" text-anchor="middle">no row in the register, no agent</text>
  <text x="1025" y="420" font-size="13" fill="#333" text-anchor="middle">a row names owner, tier, purpose,</text>
  <text x="1025" y="437" font-size="13" fill="#333" text-anchor="middle">autonomy level and legal class</text>
  <path d="M1025,330 L1025,310" stroke="#3b7fb6" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="1040" y="324" font-size="11" fill="#666">admits</text>

  <!-- right: what agents reach -->
  <rect x="1190" y="160" width="360" height="84" rx="10" fill="#ffffff" stroke="#3b7fb6" stroke-width="2"/>
  <text x="1370" y="186" font-size="16" font-weight="700" fill="#14213d" text-anchor="middle">Knowledge</text>
  <text x="1370" y="207" font-size="13" fill="#333" text-anchor="middle">data stores and vector search (RAG),</text>
  <text x="1370" y="224" font-size="13" fill="#333" text-anchor="middle">long-term memory, per agent, in the EU</text>

  <rect x="1190" y="263" width="360" height="120" rx="10" fill="#fff7f0" stroke="#d9822b" stroke-width="2"/>
  <text x="1370" y="288" font-size="16" font-weight="700" fill="#14213d" text-anchor="middle">Action services: the only credential holders</text>
  <text x="1370" y="309" font-size="13" fill="#333" text-anchor="middle">the model never holds a credential and never approves</text>
  <text x="1370" y="326" font-size="13" fill="#333" text-anchor="middle">typed operations only · dry run first · write-ahead audit</text>
  <text x="1370" y="347" font-size="13" font-weight="700" fill="#b8302e" text-anchor="middle">a human approves every sensitive action</text>
  <text x="1370" y="367" font-size="13" fill="#333" text-anchor="middle">kill switches: halt in seconds, revoke, fleet-wide stop</text>

  <rect x="1190" y="402" width="360" height="48" rx="10" fill="#f6f8fb" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="1370" y="422" font-size="15" font-weight="700" fill="#14213d" text-anchor="middle">Systems of record</text>
  <text x="1370" y="441" font-size="13" fill="#333" text-anchor="middle">Workspace administration · SaaS · internal systems</text>

  <path d="M1150,202 L1190,202" stroke="#3b7fb6" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M1150,270 L1190,300" stroke="#3b7fb6" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M1370,383 L1370,402" stroke="#d9822b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="1380" y="397" font-size="11" fill="#666">only through here</text>

  <!-- gateway arrow annotation -->
  <text x="1170" y="150" font-size="12" fill="#666" text-anchor="middle">every call to knowledge or to a system passes the gateway first</text>

  <!-- bottom: watching -->
  <path d="M440,450 L440,520" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrg)"/>
  <path d="M740,450 L740,520" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrg)"/>
  <path d="M1025,450 L1025,520" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrg)"/>
  <path d="M1370,450 L1370,520" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrg)"/>
  <text x="600" y="505" font-size="12" fill="#666">everything registered feeds it; an agent that stops feeding it is halted</text>

  <rect x="300" y="520" width="1250" height="118" rx="12" fill="#f3f4f7" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="320" y="548" font-size="17" font-weight="700" fill="#14213d">Watching</text>
  <g font-size="13" fill="#333">
    <text x="320" y="574"><tspan font-weight="700">Audit logs &amp; telemetry</tspan>: every action, every model call, every admin change, kept locked in the EU for the retention period</text>
    <text x="320" y="596"><tspan font-weight="700">Detections</tspan>: a security monitoring desk (SIEM) with a person on call; every finding names an owner and a deadline</text>
    <text x="320" y="618"><tspan font-weight="700">The independent controller (Eve)</tspan>: watches the agents and the human administrators, reports to a second human, can halt; its evidence is copied daily to a witness outside the tenant</text>
  </g>
  <path d="M1500,520 L1500,478 L1568,478 L1568,323 L1553,323" stroke="#b8302e" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrr)"/>
  <text x="1508" y="500" font-size="12" font-weight="700" fill="#b8302e">halt</text>

  <!-- footer line -->
  <text x="48" y="690" font-size="15" font-weight="700" fill="#14213d">What this buys</text>
  <g font-size="14" fill="#333">
    <text x="48" y="714">A hundredth agent costs a register row and a factory run, and inherits controls reviewed once.</text>
    <text x="48" y="736">Two grades of control, named as such: what Google or code <tspan font-weight="700">refuses</tspan>, and what is only <tspan font-weight="700">detected</tspan>. A content screen is never a boundary.</text>
    <text x="48" y="758">A privileged agent costs more than a read-only one: a second human, a bought detection desk, a witness outside the tenant and a signed deviation.</text>
  </g>
  <text x="48" y="800" font-size="12" fill="#888">Nothing here is built on 2026-09-23. The design is at github.com/jsbdfgidsfg/agentic-platform, platform/agentic-platform/01-hld.md.</text>
</svg>
